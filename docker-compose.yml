version: "3.9"

services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - quiz_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"   # Message broker port
      - "15672:15672" # Management UI (http://localhost:15672)
    networks:
      - quiz_network

  user-service:
    build: ./server/quiz_analytics_backend/user-service
    container_name: user-service
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=user_db
    depends_on:
      - mongodb
    networks:
      - quiz_network

  exam-service:
    build: ./server/quiz_analytics_backend/exam-service
    container_name: exam-service
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=quiz_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - quiz_network

  analytics-service:
    build: ./server/quiz_analytics_backend/analytics-service
    container_name: analytics-service
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=analytics_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - quiz_network

  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - exam-service
      - analytics-service
    networks:
      - quiz_network

  client:
    build: ./client
    container_name: client
    ports:
      - "5174:3000"
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - quiz_network

volumes:
  mongo_data:

networks:
  quiz_network:
    driver: bridge
